<section class="contact-hero bg-dark text-white text-center py-5">
  <div class="container">
    <h1 class="display-4 fw-bold">Contact Us</h1>
    <p class="lead mt-3">Have a question or want to work together? We'd love to hear from you.</p>
  </div>
</section>

<section class="contact-content py-5">
  <div class="container">
    <div class="row g-5">
      <div class="col-md-7">
        <div class="card border-0 shadow-sm p-4">
          <h3 class="fw-bold mb-4">Send Us a Message</h3>
          <form>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="firstName" class="form-label fw-semibold">First Name</label>
                <input
                  type="text"
                  id="firstName"
                  class="form-control"
                  placeholder="Enter your First Name..."
                />
              </div>
              <div class="col-md-6">
                <label for="lastName" class="form-label fw-semibold">Last Name</label>
                <input
                  type="text"
                  id="lastName"
                  class="form-control"
                  placeholder="Enter your Last Name..."
                />
              </div>
              <div class="col-12">
                <label for="email" class="form-label fw-semibold">Email Address</label>
                <input
                  type="email"
                  id="email"
                  class="form-control"
                  placeholder="Enter your Email..."
                />
              </div>
              <div class="col-12">
                <label for="subject" class="form-label fw-semibold">Subject</label>
                <input
                  type="text"
                  id="subject"
                  class="form-control"
                  placeholder="How can we help?"
                />
              </div>
              <div class="col-12">
                <label for="message" class="form-label fw-semibold">Message</label>
                <textarea
                  id="message"
                  class="form-control"
                  rows="5"
                  placeholder="Write your message here..."
                ></textarea>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">
                  Send Message
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div class="col-md-5">
        <h3 class="fw-bold mb-4">Get In Touch</h3>
        <ul class="list-unstyled">
          <li class="d-flex align-items-start gap-3 mb-4">
            <i class="bi bi-geo-fill bg-dark py-2 px-3 fs-5 text-white rounded"></i>
            <div>
              <h6 class="fw-bold mb-0">Address</h6>
              <p class="text-muted mb-0">123 Main Street, Mansoura, Dakahlia</p>
            </div>
          </li>
          <li class="d-flex align-items-start gap-3 mb-4">
            <i class="bi bi-telephone-fill bg-dark py-2 px-3 fs-5 text-white rounded"></i>
            <div>
              <h6 class="fw-bold mb-0">Phone</h6>
              <p class="text-muted mb-0">+20 0123456789</p>
            </div>
          </li>
          <li class="d-flex align-items-start gap-3 mb-4">
            <i class="bi bi-envelope-fill bg-dark py-2 px-3 fs-5 text-white rounded"></i>
            <div>
              <h6 class="fw-bold mb-0">Email</h6>
              <p class="text-muted mb-0">contact&#64;facebook.com</p>
            </div>
          </li>
          <li class="d-flex align-items-start gap-3">
            <i class="bi bi-clock-fill bg-dark py-2 px-3 fs-5 text-white rounded"></i>
            <div>
              <h6 class="fw-bold mb-0">Working Hours</h6>
              <p class="text-muted mb-0">Sun - Thu: 9:00 AM - 5:00 PM</p>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
